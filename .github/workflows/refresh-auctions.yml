name: Refresh auction listings

# NOTE (Jul 2026): BaankNet's WAF returns 403 Forbidden to GitHub-hosted runner IPs,
# so the daily cron was failing every night and has been disabled. The daily refresh
# now runs locally via Windows Task Scheduler ("VittaBridge auction refresh", 00:15 IST)
# using scripts/refresh-and-push.ps1. This workflow is kept for manual dispatch in case
# the block is ever lifted.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh listings from BaankNet
        run: node scripts/refresh-auctions.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- auctions.html; then
            echo "No changes to auctions.html — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auctions.html
          git commit -m "Update auction listings — automated daily refresh"
          git push
