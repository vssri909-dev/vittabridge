name: Refresh auction listings

on:
  schedule:
    # Every Monday at 02:00 UTC (~07:30 IST)
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh listings from BaankNet
        run: node scripts/refresh-auctions.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- auctions.html; then
            echo "No changes to auctions.html — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auctions.html
          git commit -m "Update auction listings — automated weekly refresh"
          git push
